<!doctype html><meta charset=utf-8><style>html,body{margin:0;background:#667;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1600,1000,false);renderer.domElement.style.width='100vw';document.body.appendChild(renderer.domElement);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();scene.background=new THREE.Color('#6a6e76');
const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture;
const camera=new THREE.PerspectiveCamera(22,1.6,.05,500);
const sun=new THREE.DirectionalLight('#fff',2);sun.position.set(-3,6,4);scene.add(sun);
let root=null;
window.X={THREE,scene,camera,renderer,
 async load(dir,file){const mgr=new THREE.LoadingManager();mgr.setURLModifier(u=>{const n=u.split(/[\\/]/).pop();return /\.(png|jpg|jpeg|tga|dds)$/i.test(n)?`../dl/${dir}/${n}`:u;});
  const o=await new FBXLoader(mgr).loadAsync(`../dl/${dir}/${file}`);if(root)scene.remove(root);root=o;scene.add(o);o.updateMatrixWorld(true);window.X.root=o;
  const box=new THREE.Box3().setFromObject(o);return {min:box.min.toArray(),max:box.max.toArray()};},
 async extra(dir,file){const mgr=new THREE.LoadingManager();mgr.setURLModifier(u=>{const n=u.split(/[\\/]/).pop();return /\.(png|jpg|jpeg|tga|dds)$/i.test(n)?`../dl/${dir}/${n}`:u;});
  const o=await new FBXLoader(mgr).loadAsync(`../dl/${dir}/${file}`);scene.add(o);o.updateMatrixWorld(true);(window.X.extras??={})[dir]=o;return true;},
 tree(){const out=[];root.traverse(o=>{const d=[];let p=o;while(p&&p!==root){d.push(p.name);p=p.parent;}
  if(o.isMesh){const g=o.geometry;const b=new THREE.Box3().setFromObject(o);const mats=(Array.isArray(o.material)?o.material:[o.material]).map(m=>m.name+(m.map?'*':'')+(m.transparent?'~':''));
   out.push({path:d.reverse().join('/'),tris:(g.index?g.index.count:g.attributes.position.count)/3,mats,min:b.min.toArray().map(v=>+v.toFixed(3)),max:b.max.toArray().map(v=>+v.toFixed(3))});}});return out;},
 shot(from,at,fov=22){camera.fov=fov;camera.position.fromArray(from);camera.lookAt(...at);camera.updateProjectionMatrix();renderer.render(scene,camera);return renderer.domElement.toDataURL('image/jpeg',.9).split(',')[1];}};
window.READY=true;
</script>
